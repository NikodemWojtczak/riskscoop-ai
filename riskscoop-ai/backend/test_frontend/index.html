        // Handle clicks on flood_stats links in messages
        function handleFloodStatsClick(event) {
            const link = event.target.closest('a');
            if (link && link.href && link.href.includes('flood_stats:')) {
                event.preventDefault();
                const layerName = link.href.split('flood_stats:')[1];
                if (layerName) {
                    openChartModal(layerName);
                }
            }
        }

        // ========== END CHART MODAL FUNCTIONS ==========

        // Change basemap style
        function changeBasemap(styleId) {
            if (styleId === currentBasemap) return;

            const styleUrl = `mapbox://styles/mapbox/${styleId}`;

            // Store current layers and sources data before changing style
            const layerData = {};
            const sourceData = {};

            // Save vector layers
            Object.entries(layers).forEach(([name, data]) => {
                const sourceId = `source-${name}`;
                const source = map.getSource(sourceId);
                if (source && source._data) {
                    sourceData[sourceId] = source._data;
                    layerData[name] = { ...data, sourceId };
                }
            });

            // Save raster layers info
            const rasterSourceData = {};
            Object.entries(rasterLayers).forEach(([name, data]) => {
                const sourceId = `raster-source-${name}`;
                const source = map.getSource(sourceId);
                if (source) {
                    rasterSourceData[name] = {
                        url: source.url,
                        coordinates: source.coordinates
                    };
                }
            });

            // Change style
            map.setStyle(styleUrl);

            // Re-add layers after style loads
            map.once('style.load', () => {
                // Re-add vector layers
                Object.entries(layerData).forEach(([name, data]) => {
                    const sourceId = data.sourceId;
                    const geojson = sourceData[sourceId];
                    if (geojson) {
                        addLayerToMap(name, geojson, data.color);
                    }
                });

                // Re-add raster layers
                Object.entries(rasterSourceData).forEach(([name, srcData]) => {
                    const sourceId = `raster-source-${name}`;
                    const layerId = `raster-layer-${name}`;

                    map.addSource(sourceId, {
                        type: 'image',
                        url: srcData.url,
                        coordinates: srcData.coordinates
                    });

                    map.addLayer({
                        id: layerId,
                        type: 'raster',
                        source: sourceId,
                        paint: {
                            'raster-opacity': 0.7,
                            'raster-fade-duration': 0
                        }
                    });

                    // Restore visibility state
                    if (hiddenRasterLayers.has(name)) {
                        map.setLayoutProperty(layerId, 'visibility', 'none');
                    }
                });
            });

            currentBasemap = styleId;

            // Save to localStorage
            localStorage.setItem('riskscoop_basemap', styleId);

            // Update menu UI
            document.querySelectorAll('.basemap-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.style === styleId);
            });
        }

        // Toggle basemap menu
        function toggleBasemapMenu() {
            basemapMenu.classList.toggle('open');
        }

        // Add raster layer to map (for flood hazard overlay)
        async function addRasterLayerToMap(name, rasterInfo) {
            const sourceId = `raster-source-${name}`;
            const layerId = `raster-layer-${name}`;

            // Remove existing if present
            if (map.getLayer(layerId)) map.removeLayer(layerId);
            if (map.getSource(sourceId)) map.removeSource(sourceId);

            // Get TIFF filename from path
            const tiffPath = rasterInfo.tiff_path;
            const filename = tiffPath.split('/').pop();
            const tiffUrl = `${API_BASE}/flood/${filename}`;

            try {
                // Load and render GeoTIFF
                const tiffData = await loadGeoTiff(tiffUrl);

                // Convert canvas to data URL
                const imageUrl = tiffData.canvas.toDataURL('image/png');

                // Coordinates for image overlay: [[west, north], [east, north], [east, south], [west, south]]
                const bounds = tiffData.bounds;
                const coords = [
                    [bounds.west, bounds.north],   // top-left
                    [bounds.east, bounds.north],   // top-right
                    [bounds.east, bounds.south],   // bottom-right
                    [bounds.west, bounds.south]    // bottom-left
                ];

                // Add image source
                map.addSource(sourceId, {
                    type: 'image',
                    url: imageUrl,
                    coordinates: coords
                });

                // Add raster layer
                map.addLayer({
                    id: layerId,
                    type: 'raster',
                    source: sourceId,
                    paint: {
                        'raster-opacity': 0.7,
                        'raster-fade-duration': 0
                    }
                });

                // Fit to raster bounds
                map.fitBounds([
                    [bounds.west, bounds.south],
                    [bounds.east, bounds.north]
                ], { padding: 50 });

                // Store bounds for fit all
                rasterInfo.bounds = bounds;

                // Store raster data for tooltip queries
                floodRasterData[name] = {
                    data: tiffData.data,
                    width: tiffData.width,
                    height: tiffData.height,
                    bounds: bounds
                };

                console.log(`GeoTIFF loaded: ${filename} (${tiffData.width}x${tiffData.height})`);

            } catch (e) {
                console.error('Failed to load GeoTIFF:', e);
                throw e;
            }

            return rasterInfo;
        }

        // Fetch layer GeoJSON from backend
        async function fetchLayer(uuid) {
            try {
                const response = await fetch(`${API_BASE}/layers/${uuid}`);
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                console.error('Failed to fetch layer:', e);
            }
            return null;
        }

        // Tool name to friendly description with arguments
        function getToolDescription(toolName, toolArgs) {
            const args = toolArgs || {};
            switch (toolName) {
                case 'search_division':
                    return `Searching for "${args.query || 'location'}"...`;
                case 'get_division':
                    return `Getting boundary for "${args.division_name || 'area'}"...`;
                case 'get_overture_data':
                    return `Querying ${args.output_layer_name || 'features'}...`;
                case 'get_flood_forecast':
                    const rp = args.return_period ? ` (RP${args.return_period})` : '';
                    return `Fetching flood data${rp}...`;
                case 'intersect_flood_zones':
                    return `Analyzing flood risk for "${args.features_layer_name || 'features'}"...`;
                case 'list_layers':
                    return 'Listing available layers...';
                default:
                    return `Running ${toolName}...`;
            }
        }

        // Send message to agent with streaming
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Create conversation if this is the first message
            if (currentConversationIndex < 0) {
                const newConv = {
                    id: Date.now(),
                    title: extractConversationTitle(message),
                    createdAt: new Date().toISOString(),
                    messages: '',
                    sessionId: null,
                    layers: {},
                    rasterLayers: {}
                };
                conversations.unshift(newConv);
                currentConversationIndex = 0;
                saveConversationsToStorage();
                updateConversationsPanel();
            } else if (conversations[currentConversationIndex].title === 'New Chat') {
                conversations[currentConversationIndex].title = extractConversationTitle(message);
                saveConversationsToStorage();
                updateConversationsPanel();
            }

            userInput.value = '';
            sendBtn.disabled = true;
            addMessage(message, 'user');

            // State tracking
            const shownTools = new Set();
            let lastSessionState = null;
            let streamingContent = '';
            let streamingMsgCreated = false;

            try {
                const formData = new FormData();
                formData.append('message', message);
                formData.append('stream', 'true');
                if (sessionId) {
                    formData.append('session_id', sessionId);
                }

                const response = await fetch(`${API_BASE}/agents/riskscoop/runs`, {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                // Show tool step as intermediate message
                function showToolStep(name, args) {
                    if (name && !shownTools.has(name)) {
                        shownTools.add(name);
                        const description = getToolDescription(name, args);
                        addMessage('', 'tool-call', { toolName: description });
                    }
                }

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const event = JSON.parse(data);
                            console.log('Stream event:', event);

                            // Handle different Agno event types
                            switch (event.event) {
                                case 'ToolCallStarted':
                                    // Show tool being called with arguments
                                    if (event.tool?.tool_name) {
                                        // Try different possible locations for arguments
                                        let toolArgs = event.tool.tool_args || event.tool.args || event.tool_args || event.arguments || {};
                                        // If args is a string (JSON), parse it
                                        if (typeof toolArgs === 'string') {
                                            try { toolArgs = JSON.parse(toolArgs); } catch(e) { toolArgs = {}; }
                                        }
                                        console.log('Tool call:', event.tool.tool_name, 'Args:', toolArgs, 'Full event:', event);
                                        showToolStep(event.tool.tool_name, toolArgs);
                                    }
                                    break;

                                case 'RunContent':
                                    // Streaming content chunk - accumulate it
                                    if (event.content) {
                                        streamingContent += event.content;
                                        // Start streaming message if not created yet
                                        if (!streamingMsgCreated && streamingContent.trim()) {
                                            hideTyping();
                                            addStreamingMessage();
                                            streamingMsgCreated = true;
                                        }
                                        if (streamingMsgCreated) {
                                            updateStreamingMessage(streamingContent);
                                        }
                                    }
                                    break;

                                case 'RunCompleted':
                                    // Final response - use this as the definitive content
                                    if (event.content) {
                                        streamingContent = event.content;
                                    }
                                    if (event.session_state) {
                                        lastSessionState = event.session_state;
                                    }
                                    break;
                            }

                            // Always capture session_id
                            if (event.session_id) {
                                sessionId = event.session_id;
                            }

                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }

                // Finalize response
                hideTyping();
                if (streamingMsgCreated && streamingContent) {
                    finalizeStreamingMessage(streamingContent);
                } else if (streamingContent) {
                    addMessage(streamingContent, 'assistant');
                } else {
                    addMessage('Done.', 'assistant');
                }

                // Process layers
                if (lastSessionState) {
                    await processSessionState(lastSessionState);
                }

                saveCurrentConversation();

            } catch (error) {
                addMessage(`Error: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                hideTyping();
            }
        }

        // Process session state for layers
        async function processSessionState(sessionState) {
            // Check for raster layers FIRST (flood data) - these take priority
            const rasterLayerNames = new Set();
            if (sessionState.raster_layers) {
                for (const [name, rasterInfo] of Object.entries(sessionState.raster_layers)) {
                    rasterLayerNames.add(name);
                    if (!rasterLayers[name] && rasterInfo.type === 'raster') {
                        try {
                            await addRasterLayerToMap(name, rasterInfo);
                            rasterLayers[name] = rasterInfo;
                            updateLayersPanel();
                            addMessage(`Flood layer "${name}" added to map`, 'system');
                        } catch (e) {
                            console.error('Failed to load GeoTIFF:', e);
                            addMessage(`Error loading flood raster: ${e.message}`, 'error');
                        }
                    }
                }
            }

            // Check for new vector layers in session state
            if (sessionState.layers) {
                for (const [name, uuid] of Object.entries(sessionState.layers)) {
                    // Skip if this layer has a raster version (it's flood data)
                    if (rasterLayerNames.has(name)) continue;

                    if (!layers[name]) {
                        const geojson = await fetchLayer(uuid);
                        if (geojson) {
                            const color = getNextColor();
                            const count = addLayerToMap(name, geojson, color);
                            layers[name] = { uuid, color, count };
                            updateLayersPanel();

                            // Show feature summary with breakdown
                            const summary = generateFeatureSummary(name, geojson);
                            addMessage(summary, 'system');
                        }
                    }
                }
            }
        }

        // Generate a summary of features in a layer
        function generateFeatureSummary(name, geojson) {
            const features = geojson.features || [];
            const count = features.length;

            if (count === 0) {
                return `Layer "${name}" added (empty)`;
            }

            // Collect stats about the features
            const stats = {};

            for (const f of features.slice(0, 100)) { // Sample first 100
                const props = f.properties || {};

                // Count by subtype or class or primary_category
                const category = props.subtype || props.class || props.primary_category || props.type || 'other';
                stats[category] = (stats[category] || 0) + 1;
            }

            // Format summary
            let summary = `Layer "${name}" added with **${count} features**`;

            const sortedStats = Object.entries(stats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5); // Top 5 categories

            if (sortedStats.length > 0 && sortedStats.length <= 5) {
                const breakdown = sortedStats
                    .map(([cat, num]) => `${cat}: ${num}`)
                    .join(', ');
                summary += ` — ${breakdown}`;
            }

            return summary;
        }

        // Initialize Mapbox map
        async function initApp() {
            try {
                // Fetch config from backend
                const response = await fetch(`${API_BASE}/app-config`);
                const config = await response.json();
                MAPBOX_TOKEN = config.mapbox_token;

                // Initialize map with saved basemap
                mapboxgl.accessToken = MAPBOX_TOKEN;
                const savedBasemap = localStorage.getItem('riskscoop_basemap') || 'dark-v11';
                currentBasemap = savedBasemap;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: `mapbox://styles/mapbox/${savedBasemap}`,
                    center: [19.4560, 51.7592], // Lodz default
                    zoom: 11
                });

                map.addControl(new mapboxgl.NavigationControl(), 'top-right');

                // Update basemap menu to show correct selection
                document.querySelectorAll('.basemap-option').forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.style === savedBasemap);
                });

                // Add flood tooltip on mouse move
                map.on('mousemove', (e) => {
                    const floodInfo = getFloodValueAtPoint(e.lngLat.lng, e.lngLat.lat);
                    if (floodInfo) {
                        showFloodTooltip(e, floodInfo);
                        map.getCanvas().style.cursor = 'pointer';
                    } else {
                        hideFloodTooltip();
                        map.getCanvas().style.cursor = '';
                    }
                });

                map.on('mouseleave', () => {
                    hideFloodTooltip();
                });

                // Event listeners
                sendBtn.addEventListener('click', sendMessage);
                userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });
                newChatBtn.addEventListener('click', newConversation);

                // Basemap selector events
                basemapBtn.addEventListener('click', toggleBasemapMenu);

                document.querySelectorAll('.basemap-option').forEach(opt => {
                    opt.addEventListener('click', () => {
                        changeBasemap(opt.dataset.style);
                        basemapMenu.classList.remove('open');
                    });
                });

                // Close basemap menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!basemapBtn.contains(e.target) && !basemapMenu.contains(e.target)) {
                        basemapMenu.classList.remove('open');
                    }
                });

                // Chart modal events
                chartModalClose.addEventListener('click', closeChartModal);
                chartModal.addEventListener('click', (e) => {
                    if (e.target === chartModal) closeChartModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (chartModal.classList.contains('open')) {
                            closeChartModal();
                        }
                        closeHistoryPanel();
                    }
                });

                // Listen for clicks on flood_stats links in chat
                chatArea.addEventListener('click', handleFloodStatsClick);

                // History panel events
                hamburgerBtn.addEventListener('click', openHistoryPanel);
                historyClose.addEventListener('click', closeHistoryPanel);

                // Load saved conversations from localStorage
                loadConversationsFromStorage();

                // Initialize layers panel (show empty state)
                updateLayersPanel();

                // Focus input
                userInput.focus();

            } catch (e) {
                console.error('Failed to initialize app:', e);
                addMessage('Error: Could not load configuration. Make sure the backend is running.', 'error');
            }
        }

        // Start the app
        initApp();
    </script>
